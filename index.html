<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#3a1d4f">
<title>Esquadrão Antibomba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>/* Ideia: uma viagem pelo corpo. A vasa sanguínea é o caminho e cada setor tem a cor do seu tecido. */
:root{
  --tinta:#2a1738;      /* contorno dos desenhos e texto */
  --vinho:#3a1d4f;      /* fundo do corpo */
  --vaso:#c9324f;       /* caminho */
  --pele:#fff6ec;       /* cartões */
  --pavio:#ffb340;      /* destaque e ação */
  --ok:#1fa971;
  --er:#e0304a;
  --mut:#7a6a86;
  --cor:#c9324f;        /* cor do setor em jogo */
  --disp:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --txt:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;background:var(--vinho);color:var(--tinta);font:600 16px/1.35 var(--txt)}
#app{max-width:520px;margin:0 auto;padding:14px 16px 112px;min-height:100%;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--pavio);outline-offset:2px}
h1,h2{margin:0;font-family:var(--disp);text-wrap:balance}
.fig{display:block;width:100%;height:100%;overflow:visible}

/* ---------- início ---------- */
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;color:#fff}
.logo{font:700 1.5rem/1 var(--disp);letter-spacing:.2px}
.logo small{display:block;font:600 .8rem var(--txt);color:#e6cfe0;margin-top:4px}
.conta{background:var(--pavio);color:var(--tinta);font:700 .85rem var(--disp);padding:5px 11px;border-radius:99px;white-space:nowrap;border:2px solid var(--tinta)}
.quartel{background:var(--pele);border:3px solid var(--tinta);border-radius:20px;padding:12px;display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;box-shadow:0 5px 0 var(--tinta)}
.anel{position:relative;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--tinta);background:conic-gradient(var(--ok) calc(var(--p)*1%),#eadfe9 0)}
.anel>span{width:68px;height:68px;border-radius:50%;background:var(--pele);border:3px solid var(--tinta);display:grid;place-items:center;font:700 1.25rem var(--disp)}
.q-t{font:700 1.15rem/1.15 var(--disp)}
.q-s{color:var(--mut);font-size:.86rem}
.aviso{color:#a84b00;font-weight:800;font-size:.85rem;margin-top:3px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:var(--pele);border:3px solid var(--tinta);border-radius:15px;padding:9px;box-shadow:0 4px 0 var(--tinta);text-align:left;display:flex;flex-direction:column;min-height:58px}
.chip b{font:700 1rem var(--disp)}
.chip span{font-size:.76rem;color:var(--mut)}
.chip:disabled{opacity:.6}
.chip:active:not(:disabled),.op:active:not(:disabled),.btn:active,.setor:active .med{transform:translateY(3px)}
.tit-cam{color:#fff;font:700 1.08rem var(--disp);margin-top:4px}

/* caminho pelo corpo */
.caminho{position:relative;height:calc(8*104px)}
.caminho>svg{position:absolute;inset:0;width:100%;height:100%}
.setor{position:absolute;display:flex;align-items:center;gap:8px;width:calc(50% + 40px);color:#fff}
.setor.esq{left:0}
.setor.dir{right:0;flex-direction:row-reverse;text-align:right}
.med{flex:none;position:relative;width:84px;height:84px;border-radius:50%;border:3px solid var(--tinta);background:conic-gradient(var(--c) calc(var(--p)*1%),#fff 0);display:grid;place-items:center;box-shadow:0 4px 0 var(--tinta)}
.med>div{width:64px;height:64px;border-radius:50%;background:var(--pele);border:3px solid var(--tinta);padding:6px}
.setor>div:last-child{background:var(--tinta);border-radius:12px;padding:5px 9px}
.s-nome{font:700 1rem/1.1 var(--disp);display:block}
.s-pct{font-size:.8rem;color:#e6cfe0;display:block}
.nota{color:#e6cfe0;font-size:.76rem;text-align:center;text-wrap:balance}
.rodape{display:flex;flex-direction:column;align-items:center;gap:6px}
.link{color:#e6cfe0;font-size:.85rem;padding:8px;font-weight:800}
.perigo{color:#ffb0bb}

/* barra fixa ao alcance do polegar */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--pele);border-top:3px solid var(--tinta);z-index:5}
.nav>div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:6px;align-items:center;padding:8px 10px}
.nav-b{font:700 .8rem var(--disp);display:flex;flex-direction:column;align-items:center;min-height:52px;justify-content:center;padding:2px}
.nav-b .ic{width:30px;height:30px}
.jogar{background:var(--pavio);border:3px solid var(--tinta);border-radius:16px;box-shadow:0 4px 0 var(--tinta);font:700 1.05rem/1.1 var(--disp);min-height:56px;padding:4px}
.jogar small{display:block;font:800 .72rem var(--txt)}

/* ---------- jogo ---------- */
body.jogo{background:color-mix(in srgb,var(--cor) 45%,#1c1026)}
.arena{position:relative;background:var(--cor);border:3px solid var(--tinta);border-radius:18px;height:88px;display:grid;grid-template-columns:40px 64px 1fr 58px;align-items:center;gap:4px;padding:0 8px;box-shadow:0 4px 0 var(--tinta);overflow:hidden;
  background-image:radial-gradient(circle at 20% 110%,#ffffff33 0 26px,transparent 27px),radial-gradient(circle at 62% -10%,#ffffff26 0 34px,transparent 35px),radial-gradient(circle at 92% 90%,#0000001f 0 20px,transparent 21px)}
.fechar{color:var(--tinta);background:var(--pele);border:3px solid var(--tinta);width:36px;height:36px;border-radius:50%;font-weight:800;line-height:1}
.heroi{width:62px;height:62px}
.pavio{position:relative;height:8px;background:#ffffff66;border-radius:9px;border:2px solid var(--tinta)}
.pavio-f{position:absolute;left:0;top:0;bottom:0;background:var(--pavio);border-radius:9px;transition:width .25s}
.contador{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font:700 .8rem var(--disp);color:#fff;white-space:nowrap;text-shadow:0 1px 0 var(--tinta)}
.bomba{width:56px;height:56px}
.estouro{position:absolute;right:0;top:0;width:88px;height:88px;opacity:0;pointer-events:none}
.acertou .heroi{animation:pula .4s}
.acertou .bomba{filter:grayscale(1);opacity:.6;transition:.2s}
.errou .estouro{animation:boom .5s forwards}
.errou .bomba{opacity:0}
.tag{color:#fff;font-size:.8rem;font-weight:800}
.enunc{font:700 1.3rem/1.22 var(--disp);color:#fff}
.centro{text-align:center}
.area{display:flex;flex-direction:column;gap:9px}
.op{background:var(--pele);border:3px solid var(--tinta);border-radius:15px;padding:12px 13px;text-align:left;width:100%;min-height:52px;box-shadow:0 4px 0 var(--tinta);font-weight:800}
.op-vf{text-align:center;font:700 1.15rem var(--disp);min-height:84px}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op.certa,.par.certa{background:#b9f0d4}
.op.errada,.par.errada{background:#ffc2cc}
.op:disabled{opacity:1}
.dica{color:#fff;font-size:.82rem;text-align:center}
/* pares */
.pares{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:9px}
.col{display:flex;flex-direction:column;gap:9px}
.par{background:var(--pele);border:3px solid var(--tinta);border-radius:13px;padding:8px 6px;font-weight:800;font-size:.86rem;min-height:68px;flex:1;line-height:1.15;box-shadow:0 3px 0 var(--tinta)}
.par-d{font-weight:700;font-size:.84rem}
.par.sel{background:#ffe0a8}
.par.feito{background:#b9f0d4;opacity:.75;box-shadow:none}
.pisca{background:#ffe0a8}
/* separar */
.sep{display:flex;flex-direction:column;gap:10px}
.sep-item{background:#fff;border:3px dashed var(--tinta);border-radius:16px;padding:18px 12px;text-align:center;font:700 1.25rem/1.15 var(--disp);min-height:92px;display:flex;align-items:center;justify-content:center}
.sep-cats{display:flex;flex-wrap:wrap;gap:9px}
.op-cat{flex:1 1 40%;text-align:center;font:700 1.02rem var(--disp)}
/* imagens */
.imgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.imgs.tres{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.op-img{background:var(--pele);border:3px solid var(--tinta);border-radius:16px;box-shadow:0 4px 0 var(--tinta);padding:8px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:128px}
.op-img .fig{width:100%;max-width:92px;height:auto;aspect-ratio:1;flex:none}
.op-img span{font:700 .8rem/1.1 var(--disp);min-height:1.1em;text-align:center}
.op-img.certa{background:#b9f0d4}
.op-img.errada{background:#ffc2cc}
/* diagrama */
.diag-box{background:var(--pele);border:3px solid var(--tinta);border-radius:18px;padding:10px;box-shadow:0 4px 0 var(--tinta)}
.diag{display:block;width:100%;height:auto}
.hs{cursor:pointer}
.hs.alvo{animation:brilha .7s 2}
.hs.errada{opacity:.35}
.rotulo{text-align:center;font:700 .95rem var(--disp);min-height:1.3em;margin-top:6px}

/* resposta: gaveta que sobe de baixo */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:9;border-top:3px solid var(--tinta);animation:sobe .2s ease-out;max-height:70%;overflow:auto}
.fb>div{max-width:520px;margin:0 auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.fb-topo{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start}
.fb-ok{background:#d3f5e3}
.fb-er{background:#ffdbe0}
.fb-fig{width:84px;height:84px;background:#fff;border:3px solid var(--tinta);border-radius:16px;padding:6px}
.fb-t{font:700 1.15rem var(--disp)}
.fb-c{font-weight:800;font-size:.92rem}
.fb-e{font-size:.92rem}
.fb-nome{font:700 .8rem var(--disp);color:var(--mut)}
.fb-novo{background:var(--pavio);border:2px solid var(--tinta);border-radius:10px;padding:4px 10px;font:700 .85rem var(--disp);text-align:center}
.btn{width:100%;display:flex;flex-direction:column;align-items:center;padding:13px;border-radius:15px;min-height:54px;justify-content:center;border:3px solid var(--tinta);box-shadow:0 4px 0 var(--tinta);background:var(--pele)}
.b-t{font:700 1.05rem var(--disp)}
.b-princ{background:var(--pavio)}
.treme{animation:treme .28s}

/* ---------- fim ---------- */
.fim-ico{width:120px;height:120px;margin:14px auto 0}
.painel{background:var(--pele);border:3px solid var(--tinta);border-radius:18px;padding:13px;display:flex;flex-direction:column;gap:5px;box-shadow:0 4px 0 var(--tinta)}
.pct{font:700 2.2rem/1 var(--disp)}
.pct-txt{color:var(--mut);font-size:.88rem}
.barra{height:12px;background:#eadfe9;border:2px solid var(--tinta);border-radius:99px;overflow:hidden}
.barra-f{height:100%;background:var(--ok)}
.sim-lin{display:flex;justify-content:space-between;font-weight:800;padding:2px 0}
.verde{color:var(--ok)}.vermelho{color:var(--er)}
h2.claro{color:#fff;font-size:1.05rem}

/* ---------- álbum ---------- */
.cab{display:flex;align-items:center;gap:10px;color:#fff}
.cab h1{font-size:1.3rem}
.album-s{color:#fff;font:700 1rem var(--disp);margin-top:6px}
.cartas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.carta{background:var(--pele);border:3px solid var(--tinta);border-radius:14px;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 3px 0 var(--tinta)}
.carta .fig{width:62px;height:62px}
.carta span{font:700 .72rem/1.05 var(--disp);text-align:center;min-height:2.1em}
.carta.fora{background:#d9cbdc;box-shadow:none}
.carta.fora .fig{filter:grayscale(1) contrast(.7);opacity:.55}
.veu{position:fixed;inset:0;background:#2a1738cc;display:grid;place-items:center;padding:20px;z-index:10}
.ficha{background:var(--pele);border:3px solid var(--tinta);border-radius:22px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:8px;text-align:center}
.ficha .fig{width:150px;height:150px;margin:0 auto}
.ficha h2{font-size:1.4rem}

/* ---------- sessão final ---------- */
.rev-intro{margin:0;color:#fff;font-size:.92rem}
.rev-card{background:var(--pele);border:3px solid var(--tinta);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 var(--tinta)}
.rev-tag{color:var(--mut);font-size:.8rem;font-weight:800}
.rev-q{font:700 1.05rem/1.2 var(--disp)}
.rev-ok{color:var(--ok);font-weight:800;font-size:.92rem}
.rev-corpo{display:flex;flex-direction:column;gap:8px}
.rev-corpo[hidden]{display:none}
.rev-b{border-left:5px solid var(--tinta);padding:2px 0 2px 10px;display:flex;flex-direction:column;font-size:.92rem}
.rev-b strong{font:700 .85rem var(--disp)}
.b-sl{border-color:var(--er)}.b-cf{border-color:var(--ok)}.b-in{border-color:var(--pavio)}

@keyframes sobe{from{transform:translateY(100%)}to{transform:none}}
@keyframes treme{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pula{0%,100%{transform:none}40%{transform:translateY(-14px) rotate(-8deg)}}
@keyframes boom{0%{opacity:1;transform:scale(.3)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes brilha{50%{filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.errou .estouro{opacity:1}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>// Banco de questões. Fonte: Microbiologia OSCH.pdf
// nivel b = página com bomba | nivel c = contexto do mesmo tema
// m = múltipla (1ª opção é a certa) | v = verdadeiro/falso | p = pares | s = separar | o = ordem
const SETORES = {
  cel: { nome: "Célula", ico: "🧫" },
  gen: { nome: "DNA e proteínas", ico: "🧬" },
  san: { nome: "Sangue", ico: "🩸" },
  imu: { nome: "Imunidade", ico: "🛡️" },
  bac: { nome: "Bactérias", ico: "🦠" },
  vir: { nome: "Vírus", ico: "👾" },
  pro: { nome: "Protozoários", ico: "🦟" },
  fun: { nome: "Fungos", ico: "🍄" },
};
const Q = [];
const m = (s, n, p, q, o, e) => Q.push({ t: "m", s, n, p, q, o, e });
const v = (s, n, p, q, a, e) => Q.push({ t: "v", s, n, p, q, a, e });
const pr = (s, n, p, q, pares, e) => Q.push({ t: "p", s, n, p, q, pares, e });
const so = (s, n, p, q, cats, itens, e) => Q.push({ t: "s", s, n, p, q, cats, itens, e });
const or = (s, n, p, q, passos, e) => Q.push({ t: "o", s, n, p, q, passos, e });
const im = (s, n, p, q, op, e) => Q.push({ t: "i", s, n, p, q, op, e, fig: op[0] }); // escolher a imagem (1ª é a certa)
const di = (s, n, p, q, diag, alvo, e, fig) => Q.push({ t: "d", s, n, p, q, diag, alvo, e, fig }); // tocar na estrutura

/* ===================== CÉLULA ===================== */
m("cel","b",3,"O que a microbiologia estuda?",["Os microrganismos (as vidas pequenas)","Somente os órgãos do corpo","Somente as doenças hereditárias","Os ossos e os músculos"],"Micro = pequeno, bio = vida, logia = estudo.");
pr("cel","b",3,"Ligue cada parte da palavra ao significado",[["Micro","Pequeno"],["Bio","Vida"],["Logia","Estudo"]],"Microbiologia = estudo das vidas pequenas.");
v("cel","b",3,"O estudo da microbiologia exige o uso do microscópio.",true,"Os microrganismos não são vistos a olho nu.");
m("cel","b",3,"Qual destes NÃO é objeto de estudo da microbiologia?",["Vértebras","Bactérias","Fungos","Protozoários"],"A aula lista células, bactérias, fungos, vírus, algas e protozoários.");
m("cel","b",19,"A palavra célula vem do latim cella, que significa:",["Câmara","Vida","Pequeno","Núcleo"],"Cella = câmara.");
v("cel","b",19,"As células são as menores unidades funcionais, estruturais e genéticas dos seres vivos.",true,"Essa é a definição da aula. Vale decorar.");
m("cel","b",19,"Quantas células o corpo humano possui, aproximadamente?",["30 trilhões","30 bilhões","3 trilhões","300 milhões"],"Cerca de 30 trilhões, em 200 formas diferentes.");
m("cel","b",19,"Quantas formas diferentes de células possuímos, aproximadamente?",["200","20","2.000","46"],"São 30 trilhões de células em cerca de 200 formas.");
m("cel","b",19,"Como as células podem ser classificadas?",["Eucariontes ou procariontes","Aeróbias ou anaeróbias","Dominantes ou recessivas","Inatas ou adaptativas"],"Euca = núcleo verdadeiro. Proca = sem núcleo formado.");
v("cel","b",19,"As células se diferem em forma e função dependendo de onde se encontram.",true,"O neurônio e a hemácia são exemplos bem diferentes.");
so("cel","c",20,"Procarionte ou eucarionte?",["Procarionte","Eucarionte"],[["Bactérias",0],["Archeas",0],["Cianobactérias",0],["Protozoários",1],["Fungos",1],["Seres humanos",1],["Plantas",1]],"Procariontes formam o antigo reino monera.");
pr("cel","c",22,"Estruturas da bactéria: ligue à função",[["Cápsula","Escudo protetor"],["Parede celular","Dá forma, é rígida"],["Membrana plasmática","Controla entrada e saída"],["Citoplasma","Onde ocorrem as reações"],["Nucleoide","DNA sem núcleo formado"],["Ribossomos","Produzem proteínas"],["Flagelo","Locomoção"],["Fímbrias","Fixação, como ganchos"]],"Bactéria tem DNA, mas não tem núcleo formado.");
v("cel","b",25,"A célula eucarionte possui núcleo verdadeiro.",true,"Dentro do núcleo fica o DNA, organizado em cromossomos.");
v("cel","c",22,"A célula procarionte possui um núcleo bem formado.",false,"Ela tem nucleoide: o DNA fica sem núcleo formado.");
m("cel","b",25,"Na célula eucarionte, onde fica o DNA?",["No núcleo, organizado em cromossomos","Solto no citoplasma","Na membrana plasmática","Nos lisossomos"],"O núcleo guarda a informação e comanda a célula.");
m("cel","b",25,"Qual é a função da membrana plasmática?",["Controlar a entrada e a saída de substâncias","Produzir energia","Digerir a célula","Guardar o DNA"],"Ela envolve toda a célula e controla o que entra e sai.");
m("cel","b",25,"O citoplasma é a região:",["Entre a membrana e o núcleo","Dentro do núcleo","Fora da membrana","Dentro da mitocôndria"],"Ali ficam organelas, água, proteínas, sais minerais e citoesqueleto.");
pr("cel","c",26,"Organelas: ligue à função",[["Mitocôndria","Energia (ATP)"],["RER","Síntese de proteínas"],["REL","Lipídios e desintoxicação"],["Complexo de Golgi","Modifica, empacota, secreta"],["Lisossomos","Digestão celular"],["Peroxissomos","Degrada substâncias tóxicas"]],"RER tem ribossomos, por isso faz proteínas.");
m("cel","c",26,"Qual organela produz a “moeda energética” da célula (ATP)?",["Mitocôndria","Lisossomo","Complexo de Golgi","Peroxissomo"],"Mitocôndria = usina de energia.");
m("cel","b",27,"Qual destas NÃO é uma função geral das células na aula?",["Fotossíntese","Produção de energia","Síntese de proteínas","Manutenção da homeostase"],"As cinco funções: energia, proteínas, reprodução, transporte e homeostase.");
v("cel","b",27,"Reprodução (divisão celular) e transporte de substâncias são funções gerais das células.",true,"Junto com energia, síntese de proteínas e homeostase.");
m("cel","b",28,"As células especializadas são chamadas de “unidade funcional” porque:",["São responsáveis pela função característica do órgão","São as maiores células do corpo","Existem apenas no sangue","Não possuem núcleo"],"Cada órgão tem células que sustentam a sua função.");
pr("cel","c",29,"Ligue a célula ao órgão",[["Neurônio","Cérebro"],["Cardiomiócito","Coração"],["Pneumócito","Pulmões"],["Hepatócito","Fígado"],["Célula tubular","Rim"],["Enterócito","Intestino"],["Célula folicular","Tireoide"],["Queratinócito","Pele"],["Fotorreceptor","Retina"],["Oócito","Ovário"]],"Hepato = fígado. Cardio = coração. Pneumo = pulmão.");
pr("cel","c",30,"Ligue a célula à função",[["Neurônio","Transmite impulsos nervosos"],["Cardiomiócito","Contração do coração"],["Pneumócito","Trocas gasosas e surfactante"],["Hepatócito","Metabolismo e detoxificação"],["Enterócito","Absorve nutrientes"],["Melanócito","Produz melanina"],["Célula folicular","Produz T3 e T4"]],"Tireoide produz T3 e T4 pela célula folicular.");

    salvar(); return proxima();
  }
  // Errou: a questão volta 3 posições à frente, embaralhada de novo (uma vez por rodada).
  if (!ok && !R.repetidas[q.id] && R.modo !== "simulado") {
    R.repetidas[q.id] = 1;
    R.fila.splice(Math.min(R.i + 3, R.fila.length), 0, q.id);
  }
  const f = figDaQuestao(q);
  const nova = ok && F[f] && !E.alb[f];
  if (nova) E.alb[f] = 1;
  salvar();
  const a = app();
  $("#arena").classList.add(ok ? "acertou" : "errou");
  if (!ok) { a.classList.remove("treme"); void a.offsetWidth; a.classList.add("treme"); }
  const fb = el("div", "fb " + (ok ? "fb-ok" : "fb-er"));
  const g = el("div");
  const topo = el("div", "fb-topo");
  const tx = el("div");
  tx.append(el("div", "fb-t", ok ? ["Desarmou!", "Isso aí!", "Na mosca!"][R.i % 3] : "Explodiu!"));
  if (!ok && certaTxt) tx.append(el("div", "fb-c", "Certo: " + certaTxt));
  if (q.e) tx.append(el("div", "fb-e", q.e));
  tx.append(el("div", "fb-nome", F[f][0]));
  topo.append(html("div", "fb-fig", fig(f)), tx);
  g.append(topo);
  if (nova) g.append(el("div", "fb-novo", `Figurinha nova no álbum: ${F[f][0]}`));
  const n = el("button", "btn b-princ"); n.append(el("span", "b-t", "Próxima")); n.onclick = proxima;
  g.append(n);
  fb.append(g);
  document.body.append(fb);
}
function proxima() {
  document.querySelectorAll(".fb").forEach((x) => x.remove());
  R.i++;
  if (R.i >= R.fila.length) return fim();
  salvar(); pergunta();
}

// múltipla escolha
function rM(q, area) {
  const certa = q.o[0];
  const simu = R.modo === "simulado";
  embaralhar(q.o).forEach((t) => {
    const b = el("button", "op", t);
    b.onclick = () => {
      area.querySelectorAll("button").forEach((x) => { x.disabled = true; if (!simu && x.textContent === certa) x.classList.add("certa"); });
      if (!simu && t !== certa) b.classList.add("errada");
      responder(q, t === certa, certa);
    };
    area.append(b);
  });
}
// verdadeiro ou falso
function rV(q, area) {
  const g = el("div", "vf");
  [[true, "✅ Verdadeiro"], [false, "❌ Falso"]].forEach(([val, txt]) => {
    const b = el("button", "op op-vf", txt);
    b.onclick = () => {
      const ok = val === q.a;
      g.querySelectorAll("button").forEach((x) => (x.disabled = true));
      if (R.modo !== "simulado") b.classList.add(ok ? "certa" : "errada");
      responder(q, ok, q.a ? "Verdadeiro" : "Falso");
    };
    g.append(b);
  });
  area.append(g);
}
// pares: no máximo 4 por vez, sorteados, para caber na tela
function rP(q, area) {
  const pares = embaralhar(q.pares).slice(0, 4);
  let sel = null, erros = 0, feitos = 0;
  area.append(el("div", "dica", "Toque em um item de cada lado"));
  const g = el("div", "pares"), esq = el("div", "col"), dir = el("div", "col");
  const dirBtns = [];
  embaralhar(pares).forEach((par) => {
    const b = el("button", "par", par[0]); b.dataset.k = par[1];
    b.onclick = () => { if (sel) sel.classList.remove("sel"); sel = b; b.classList.add("sel"); };
    esq.append(b);
  });
  embaralhar(pares).forEach((par) => {
    const b = el("button", "par par-d", par[1]);
    b.onclick = () => {
      if (!sel) { b.classList.add("pisca"); setTimeout(() => b.classList.remove("pisca"), 300); return; }
      if (sel.dataset.k === par[1]) {
        [sel, b].forEach((x) => { x.classList.remove("sel"); x.classList.add("feito"); x.disabled = true; });
        sel = null; feitos++; vibrar(15);
        if (feitos === pares.length) responder(q, erros === 0, erros ? `${pares.length} pares ligados, com ${erros} tropeço${erros > 1 ? "s" : ""}` : null);
      } else {
        erros++; vibrar(50);
        const s = sel; [s, b].forEach((x) => x.classList.add("errada"));
        setTimeout(() => [s, b].forEach((x) => x.classList.remove("errada")), 350);
      }
    };
    dirBtns.push(b); dir.append(b);
  });
  g.append(esq, dir); area.append(g);
}
// separar: um item por vez, no máximo 5
function rS(q, area) {
  const itens = embaralhar(q.itens).slice(0, 5);
  let i = 0, erros = 0;
  const corpo = el("div", "sep");
  const item = el("div", "sep-item"), prog = el("div", "dica");
  const btns = el("div", "sep-cats");
  const mostra = () => { item.textContent = itens[i][0]; prog.textContent = `${i + 1} de ${itens.length}`; };
  q.cats.forEach((c, idx) => {
    const b = el("button", "op op-cat", c);
    b.onclick = () => {
      const certo = itens[i][1] === idx;
      if (!certo) { erros++; vibrar(50); }
      const alvo = btns.children[itens[i][1]];
      alvo.classList.add("certa"); if (!certo) b.classList.add("errada");
      [...btns.children].forEach((x) => (x.disabled = true));
      setTimeout(() => {
        [...btns.children].forEach((x) => { x.disabled = false; x.classList.remove("certa", "errada"); });
        i++;
        if (i >= itens.length) { btns.remove(); item.remove(); prog.remove(); responder(q, erros === 0, erros ? `${itens.length - erros} de ${itens.length} no lugar certo` : null); }
        else mostra();
      }, certo ? 280 : 750);
    };
    btns.append(b);
  });
  mostra(); corpo.append(prog, item, btns); area.append(corpo);
}
// ordem: toque na sequência certa
function rO(q, area) {
  let prox = 0, erros = 0;
  area.append(el("div", "dica", "Toque do primeiro para o último"));
  embaralhar(q.passos).forEach((t) => {
    const b = el("button", "op", t);
    b.onclick = () => {
      if (t === q.passos[prox]) {
        b.disabled = true; b.classList.add("certa"); prox++; b.textContent = prox + ". " + t; vibrar(15);
        if (prox === q.passos.length) responder(q, erros === 0, erros ? q.passos.join(" → ") : null);
      } else {
        erros++; vibrar(50); b.classList.add("errada"); setTimeout(() => b.classList.remove("errada"), 350);
      }
    };
    area.append(b);
  });
}

// escolher a imagem: o nome só aparece depois de responder
function rI(q, area) {
  const g = el("div", "imgs" + (q.op.length === 3 ? " tres" : ""));
  const certa = q.op[0];
  embaralhar(q.op).forEach((k, n) => {
    const b = el("button", "op-img"); b.dataset.k = k;
    b.setAttribute("aria-label", "Imagem " + (n + 1));
    b.innerHTML = fig(k); const nome = el("span"); b.append(nome);
    b.onclick = () => {
      g.querySelectorAll("button").forEach((x) => { x.disabled = true; x.querySelector("span").textContent = F[x.dataset.k][0]; if (x.dataset.k === certa) x.classList.add("certa"); });
      if (k !== certa) b.classList.add("errada");
      responder(q, k === certa, F[certa][0]);
    };
    g.append(b);
  });
  area.append(g);
}
// tocar na estrutura do desenho
function rD(q, area) {
  const box = html("div", "diag-box", DIAG[q.diag]);
  const rot = el("div", "rotulo", "Toque no desenho");
  box.append(rot); area.append(box);
  let fim = false;
  box.querySelector("svg").addEventListener("click", (e) => {
    const h = e.target.closest(".hs"); if (!h || fim) return;
    fim = true;
    const ok = h.dataset.k === q.alvo;
    const nomes = NOMES_DIAG[q.diag];
    box.querySelector(`.hs[data-k="${q.alvo}"]`).classList.add("alvo");
    if (!ok) h.classList.add("errada");
    rot.textContent = ok ? nomes[q.alvo] : `Você tocou: ${nomes[h.dataset.k]}`;
    responder(q, ok, nomes[q.alvo]);
  });
}

// ---------- fim ----------
function fim() {
  const r = R; E.rodada = null; E.melhorCombo = Math.max(E.melhorCombo, r.maxCombo); salvar();
  limpar();
  const a = app();
  if (r.modo === "simulado") return fimSimulado(r);
  const tot = r.ok + r.erro;
  a.append(html("div", "fim-ico", r.ok >= r.erro ? fig(MASCOTE[POR_ID[r.fila[0]].s]) : figBomba()));
  a.append(el("h1", "enunc centro", r.erro === 0 ? "Rodada limpa!" : r.ok >= r.erro ? "Bom trabalho!" : "Vamos de novo?"));
  const res = el("section", "painel");
  res.append(el("div", "pct", `${r.ok}/${tot}`), el("div", "pct-txt", `acertos · melhor sequência: ${r.maxCombo}`));
  const pB = pct(Q.filter((q) => q.n === "b"));
  res.append(el("div", "pct-txt", `${pB}% das bombas desarmadas · ${E.pts} pontos · álbum ${Object.keys(E.alb).length}/${ordemF.length}`), barra(pB));
  a.append(res);
  const m = r.modo;
  a.append(botao("Mais uma", "b-princ", () => iniciar(m === "setor" ? Q.filter((q) => q.s === POR_ID[r.fila[0]].s) : Q, m === "setor" ? "setor" : "rapida")));
  a.append(botao("Início", "b-sec", home));
}
function fimSimulado(r) {
  const a = app();
  const nota = (r.ok * 10) / r.simRes.length;
  a.append(html("div", "fim-ico", fig(nota >= 7 ? "linfT" : "cisto")));
  a.append(el("h1", "enunc centro", "Nota " + nota.toFixed(1).replace(".", ",")));
  const pan = el("section", "painel");
  Object.entries(SETORES).forEach(([k, s]) => {
    const l = r.simRes.filter((x) => POR_ID[x.id].s === k);
    if (!l.length) return;
    const ok = l.filter((x) => x.ok).length;
    const li = el("div", "sim-lin"); li.append(el("span", "", s.nome), el("span", ok === l.length ? "verde" : "vermelho", `${ok}/${l.length}`));
    pan.append(li);
  });
  a.append(pan);
  const errs = r.simRes.filter((x) => !x.ok);
  if (errs.length) {
    a.append(el("h2", "claro", "O que você errou"));
    errs.forEach((x) => {
      const q = POR_ID[x.id];
      const c = el("div", "rev-card");
      c.append(el("div", "rev-tag", `${SETORES[q.s].nome} · p.${q.p}`), el("div", "rev-q", q.q), el("div", "rev-ok", "Certo: " + x.certa));
      if (q.e) c.append(el("div", "fb-e", q.e));
      a.append(c);
    });
  }
  a.append(botao("Início", "b-princ", home));
}

// ---------- sessão final ----------
function revisao() {
  limpar();
  const a = app();
  const bar = el("div", "cab");
  const x = el("button", "fechar", "✕"); x.setAttribute("aria-label", "Voltar"); x.onclick = home;
  bar.append(x, el("h1", "", "Revisar com a professora"));
  a.append(bar);
  a.append(el("p", "rev-intro", "Estes pontos do material parecem conflitar com a literatura ou com outro slide. Eles não contam ponto nem entram no jogo. Confirme com a professora o que vale para a prova."));
  REVISAO.slice().sort((p, q) => (q.bomba ? 1 : 0) - (p.bomba ? 1 : 0)).forEach((r) => {
    const c = el("div", "rev-card");
    c.append(el("div", "rev-tag", `${r.bomba ? "💣" : "🧨"} p.${r.pag}`), el("div", "rev-q", r.pergunta));
    const ver = el("button", "op", "Ver o que conferir");
    const corpo = el("div", "rev-corpo");
    corpo.hidden = true;
    const bloco = (t, txt, cls) => { const d = el("div", "rev-b " + cls); d.append(el("strong", "", t), el("span", "", txt)); return d; };
    corpo.append(bloco("O slide diz", r.slide, "b-sl"), bloco("Conferência", r.conferencia, "b-cf"), bloco("Revisão indicada", r.indicacao, "b-in"));
    ver.onclick = () => { corpo.hidden = !corpo.hidden; ver.textContent = corpo.hidden ? "Ver o que conferir" : "Fechar"; if (!E.rev[r.id]) { E.rev[r.id] = 1; salvar(); } };
    c.append(ver, corpo);
    a.append(c);
  });
  a.append(botao("Início", "b-princ", home));
}

carregar();
home();
if ("serviceWorker" in navigator && location.protocol === "https:") { navigator.serviceWorker.register("sw.js").catch(() => {}); }
